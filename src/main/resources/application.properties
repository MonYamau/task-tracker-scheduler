spring.application.name=task-tracker-scheduler
spring.profiles.active=local
spring.config.import=file:./.env[.properties]

spring.kafka.consumer.group-id=report_summarizer_group
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JacksonJsonDeserializer
spring.kafka.consumer.properties[spring.json.value.default.type]=ru.monyamau.task_tracker_scheduler.dto.summarization.PersonalTaskReportDto
spring.kafka.consumer.properties[spring.json.use.type.headers]=false

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer

kafka.topics.response=TASK_REPORT_RESPONSES
kafka.topics.request=TASK_REPORT_REQUESTS
kafka.topics.mailing=EMAIL_SENDING_TASKS

spring.cloud.openfeign.client.config.backendInternalClient.connect-timeout=6000
spring.cloud.openfeign.client.config.backendInternalClient.read-timeout=6000
spring.cloud.openfeign.client.config.backendInternalClient.default-request-headers.X-Internal-Token=${backend-service.token}